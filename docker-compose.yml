services:
  # Backend Service (Spring Boot)
  backend:
    build: .
    container_name: spring-backend
    ports:
      - "8080:8080"
    environment:
      # host.docker.internal allows container to access SQL Server running on Windows host
      - DB_URL=jdbc:sqlserver://host.docker.internal:1433;databaseName=student_1;encrypt=true;trustServerCertificate=true;
      - DB_USERNAME=sa
      - DB_PASSWORD=sa
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend Service (React + Nginx)
  frontend:
    build: 
      context: E:/Ky7/SBA301/My_Project
    container_name: react-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
