spring.application.name=Project_web

# Database Configuration (Flexible for Cloud/Docker)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=student_1;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sa}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

